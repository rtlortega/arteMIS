# arteMIS pipeline configuration.
#
# `--mode` / `--scores` on the CLI are for quick day-to-day swaps between runs
# (e.g. `artemis-run --config config.yaml --mode target --scores modcosine`).
# Everything that defines the experiment itself lives here.

mode: global   # global | seed | target — overridden by --mode. global needs no target class.

paths:
  mgf_file: ""      # input .mgf
  chem_file: ""     # csv: MS2Query results (global), seed annotations (seed), or class table (target)
  out_dir: "output"

# Similarity score families to compute. `--scores modcosine,cosine` picks a
# subset of these keys; anything not listed here can't be selected.
# `tolerance` is the m/z matching tolerance passed to FlashCosine (default 0.02 if omitted).
scores:
  modcosine:
    label: "Modified Cosine"
    tolerance: 0.02
  #cosine:
  #  label: "Cosine"
  #  tolerance: 0.02

# Spectrum preprocessing applied before scoring.
preprocessing:
  clean_peaks: true   # false: DEFAULT_FILTERS only. true: DEFAULT_FILTERS + CLEAN_PEAKS
                        # (mz range 0-1000, drop <0.1% relative-intensity peaks, cap at 1000 peaks,
                        # require >=5 high-intensity peaks, denoise, drop profiled spectra).

# Column in chem_file used for chemistry metrics / class labels.
chem_level: "npc_pathway_results" #usual column from MS2Query results

# Only read when mode: target.
target:
  class: ""                     # e.g. "melleolides" — required if mode: target
  unlabeled_value: "No label"   # mode: seed drops chem_level rows equal to this

sampling:
  n_networks: 100
  seed: 27
  param_space:
    max_comp_size: [50, 200]
    max_links: [5, 50]
    cut_off: [0.55, 0.88]
    matching_peaks: [2, 10]
  # top_n per network is always max_links + 1 — not user-configurable.

optimization:
  maximize:
    - chem_net_avg_intra
    - chem_consistency_measurement
  minimize:
    - top_isolated_nodes
    - top_degree_cv
    - top_component_size_gini
  weights: {}   # optional per-metric override, e.g. {chem_consistency_measurement: 2.0}

# Available metric names by mode (for reference — invalid names error out at load time):
#   topology (all modes):     top_degree_cv, top_isolated_nodes, top_component_size_gini
#   chemistry (global/seed):  chem_net_avg_intra, chem_net_avg_inter, chem_consistency_measurement
#   chemistry (target):       chem_edge_purity_target_incident, chem_component_purity_target_components,
#                              chem_target_component_purity
